# ~/.config/tmux/tmux.conf（hsincode/dotfiles の config/tmux/tmux.conf）
# Linux と macOS で共通。OS ごとの差分は最後に読む ~/.config/tmux/os.conf にある。

set -g prefix C-Space
set -g mouse on
set -g mode-keys vi
set -g base-index 1
# スクロールバックの途切れ・再描画ズレ対策
set -g history-limit 50000
set -g aggressive-resize on

# ---- 見た目（色は os.conf 側のテーマで上書きされることがある） ----
set -g status-position top
set -g status-justify absolute-centre
set -g status-left '*#S'
set -g status-right ''
set -g status-style 'bg=default'
set -g window-status-current-style 'bg=default bold'

# ---- 端末（Ghostty）との連携 ----
set -g default-terminal 'tmux-256color'
# truecolor / OSC 9;4 プログレスバー / OSC 8 リンク / undercurl / 拡張キー / OSC 52 クリップボード
set -as terminal-features ',xterm-ghostty:RGB:progressbar:hyperlinks:usstyle:extkeys:clipboard'
# 通知・プログレス・OSC 52 などを外側の端末へ通す（非表示のペインも）
set -g allow-passthrough all
# コピーを OSC 52 で端末のクリップボードへ送る。OS のクリップボードへは os.conf の copy-command
set -s set-clipboard on
# Shift+Enter など修飾キー付きのキーを区別する（Claude Code の推奨）
set -s extended-keys on
# フォーカスの出入りをペインへ伝える（通知のフォーカス判定・vim の autoread）
set -g focus-events on

# ---- キー ----
bind r source-file ~/.config/tmux/tmux.conf \; display 'tmux.conf を読み直しました'

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind H resize-pane -L 5
bind L resize-pane -R 5
bind K resize-pane -U 2
bind J resize-pane -D 2

bind C new-window -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind g popup -d '#{pane_current_path}' -E -w 100% -h 100% lazygit

# コピーモード: v で選択開始、y / Enter / ドラッグ終了でコピー（OSC 52 と copy-command の両方へ）
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# OS ごとの差分（最後に読むので、ここまでの設定を上書きできる）
source-file -q ~/.config/tmux/os.conf
