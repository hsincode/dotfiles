# Linux 固有（~/.config/tmux/os.conf としてリンクされ、tmux.conf の最後に読まれる）

# X11 のクリップボードへも載せる。xclip は 1MB 超で貼り付け先を固めるので clipset を使う
set -s copy-command '~/.local/bin/clipset >/dev/null 2>&1'

# 配色は dwm のテーマに追従する。current.conf は ~/.config/dwm/theme-apply.sh が
# 張り替えるリンク（dotfiles の外）。無ければ何もしない。
source-file -q ~/.config/dwm/tmux/current.conf
